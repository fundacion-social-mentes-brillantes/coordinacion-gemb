<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/pwa-192x192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- El zoom accidental (doble toque) se desactiva por CSS con
         `touch-action: manipulation`, que NO rompe los toques. Aquí dejamos
         vivo el pellizco para acercar, que es una ayuda de accesibilidad. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03050f" />
    <meta name="description" content="Coordinación — Gimnasio Emocional Mentes Brillantes: asistencia y calendario de las reuniones." />

    <!-- iOS: comportamiento como app instalada. La barra de arriba queda
         transparente sobre el azul de la app (la cabecera deja el espacio). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coordinación GEMB" />

    <title>Coordinación GEMB</title>

    <!-- La letra de la marca ("Coordinación"); el resto usa la del sistema. -->
    <link rel="preload" href="/fuentes/league-spartan-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Pone los colores que cada quien eligió en Ajustes ANTES de pintar
         (sin parpadeo). Son variables ya calculadas por src/lib/tema.ts; por
         si acaso, solo se aceptan nombres y valores con forma de color. -->
    <script>
      (function () {
        try {
          var vars = JSON.parse(localStorage.getItem('gemb-apariencia-vars') || 'null');
          if (!vars || typeof vars !== 'object') return;
          var r = document.documentElement.style;
          for (var k in vars) {
            var v = vars[k];
            if (/^--(c|app)-[a-z0-9-]+$/.test(k) && typeof v === 'string' && /^[#a-z0-9 ,.%()\-]+$/i.test(v)) {
              r.setProperty(k, v);
            }
          }
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && /^#[0-9a-f]{6}$/i.test(vars['--app-meta'] || '')) m.setAttribute('content', vars['--app-meta']);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Lo que se ve mientras carga la app: la marca con una luz que gira.
         React lo reemplaza en cuanto arranca. -->
    <div id="root">
      <div class="arranque" role="status" aria-label="Cargando Coordinación">
        <div class="arranque-icono">
          <span class="arranque-orbita"></span>
          <img src="/pwa-192x192.png" alt="" width="84" height="84" />
        </div>
        <p class="marca-titulo">Coordinación</p>
        <p class="marca-gemb">GEMB</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
