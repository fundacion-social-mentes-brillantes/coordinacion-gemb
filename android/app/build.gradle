apply plugin: 'com.android.application'

// La llave de firma vive FUERA del repositorio (que es público): la ruta y las
// claves están en android/keystore.properties, que git ignora. Copia de
// respaldo en Azure Key Vault kv-gemb-secretos (android-coordinacion-*).
def llaveProps = new Properties()
def llaveArchivo = rootProject.file('keystore.properties')
if (llaveArchivo.exists()) {
    llaveArchivo.withInputStream { llaveProps.load(it) }
}

android {
    namespace = "com.gimnasioemocionalmb.coordinacion"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gimnasioemocionalmb.coordinacion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (llaveArchivo.exists()) {
                storeFile file(llaveProps['storeFile'])
                storePassword llaveProps['storePassword']
                keyAlias llaveProps['keyAlias']
                keyPassword llaveProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (llaveArchivo.exists()) {
                signingConfig signingConfigs.release
            }
            // Desde la 1.0.5 (19 nov 2026): R8 achica y ofusca el código. Play Console
            // avisó que con «Ofuscación 1 %» la app pierde visibilidad y no deja publicar
            // desde feb 2027. Las reglas propias están en proguard-rules.pro; al subir a
            // Play hay que subir también build/outputs/mapping/release/mapping.txt.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Páginas de 16 KB (aviso de Play, 17 nov 2026): la única biblioteca nativa es
// libdatastore_shared_counter.so de androidx.datastore, que llega con Firebase. La
// 1.1.3 venía compilada con el NDK r25c; la 1.3.0 viene con el r27 y alineada a 16 KB.
configurations.all {
    resolutionStrategy.eachDependency { detalles ->
        if (detalles.requested.group == 'androidx.datastore') {
            detalles.useVersion '1.3.0'
            detalles.because 'la 1.3.0 trae libdatastore_shared_counter.so compilada con el NDK r27 (16 KB)'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Entrar con Google de forma nativa: Google no deja entrar desde un WebView.
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    // El aviso del día antes (Firebase Cloud Messaging), desde la 1.0.4.
    implementation platform("com.google.firebase:firebase-bom:34.0.0")
    implementation "com.google.firebase:firebase-messaging"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
